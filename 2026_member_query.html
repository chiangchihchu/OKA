        function search() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('results');
            
            if (query.length < 2) {
                resultsDiv.innerHTML = '<div class="tip">請輸入至少兩個字以開始查詢。</div>';
                return;
            }

            const filtered = members.filter(m => m.name.includes(query));

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="no-result">查無資料，請確認姓名是否正確。</div>';
                return;
            }

            resultsDiv.innerHTML = filtered.map(m => `
                <div class="member-card">
                    <div class="member-header">
                        <span class="name">${m.name}</span>
                        <span class="group">${m.group}</span>
                    </div>
                    <div class="info-grid">
                        <div><span class="label">編號：</span><span class="value">${m.id}</span></div>
                        <div><span class="label">資格：</span><span class="value">${m.status}</span></div>
                        <div><span class="label">職務：</span><span class="value">${m.role || '一般會員'}</span></div>
                        <div><span class="label">繳費：</span><span class="value">${m.fee ? m.fee + ' 元' : '已繳/免繳'}</span></div>
                        ${m.note ? `<div style="grid-column: span 2;"><span class="label">備註：</span><span class="value">${m.note}</span></div>` : ''}
                    </div>
                </div>
            `).join('');
        }
    </script>
