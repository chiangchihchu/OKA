    const attractions=["那霸馬拉松會場 / 奧武山公園","首里城公園","國際通","牧志公設市場","壺屋燒物街","沖繩世界","玉泉洞","和平祈念公園","瀨長島 Umikaji Terrace","沖繩 ASHIBINAA Outlet","波上宮","福州園","DFS T Galleria Okinawa","San-A Naha Main Place","識名園","美國村 American Village","知念岬公園","瀨長島溫泉 龍神之湯","iias Okinawa Toyosaki","那霸機場商店街"].map((n,i)=>[n,"琉球文化、海島風景、跑者動線與購物補給",`${n} 是本次那霸跑旅可串聯的重要節點。此處安排兼顧跑者體力、親友團自由度與沖繩在地文化。行程設計以賽前報到、賽事日、跑後恢復、南部文化自然與回程採買為主軸，讓五天旅程不只完成馬拉松，也能理解琉球王國、島嶼飲食、海洋風景與現代那霸生活。實際開放時間、票價與交通狀況皆需出發前再次確認。`,"45 分鐘–3 小時","單軌 / 步行 / 包車 / 計程車","注意營業時間、天候、跑後疲勞與團體集合。",`https://www.google.com/search?q=${encodeURIComponent(n+' 沖繩')}`]);
    const desserts=["Fontana Gelato","Blue Seal 國際通店","C&C BREAKFAST OKINAWA","oHacorte","BALL DONUT PARK","35 Coffee","瀨長島海景咖啡","ASHIBINAA Outlet 周邊咖啡","御菓子御殿 國際通松尾店","那霸機場甜點伴手禮"].map((n,i)=>[n,"甜點 / 咖啡",i%2?"紅芋、冰淇淋、咖啡":"水果塔、鬆餅、沖繩限定甜點","適合作為跑後補糖、國際通散步或回程採買中途休息點。","14:00–17:00",`https://www.google.com/search?q=${encodeURIComponent(n+' 沖繩')}`]);
    const routes=[{day:"Day 1",area:"那霸機場・新都心・奧武山・國際通",mode:"transit",transport:"單軌電車＋步行",origin:"Naha Airport",destination:"Almont Hotel Naha Omoromachi",points:["Almont Hotel Naha Omoromachi","Onoyama Park Naha","Kokusai Dori Naha","Makishi Public Market"],note:"抵達、寄放行李、賽事報到與短距離採買。"},{day:"Day 2",area:"奧武山公園・那霸馬拉松路線・慶功餐廳",mode:"transit",transport:"單軌電車＋跑步＋計程車",origin:"Almont Hotel Naha Omoromachi",destination:"Almont Hotel Naha Omoromachi",points:["Onoyama Park Naha","NAHA Marathon Start Area","Kokusai Dori Naha","Yakiniku restaurant Naha"],note:"賽事日以官方會場交通管制為準。"},{day:"Day 3",area:"首里・壺屋・牧志・國際通",mode:"transit",transport:"單軌電車＋步行",origin:"Almont Hotel Naha Omoromachi",destination:"Almont Hotel Naha Omoromachi",points:["Shurijo Castle Park","Tsuboya Yachimun Street","Makishi Public Market","Kokusai Dori Naha"],note:"跑後恢復文化日，避免過度步行。"},{day:"Day 4",area:"南部文化自然・瀨長島夕景",mode:"driving",transport:"建議包車 / 分車計程車",origin:"Almont Hotel Naha Omoromachi",destination:"Almont Hotel Naha Omoromachi",points:["Okinawa World","Gyokusendo Cave","Okinawa Peace Memorial Park","Senagajima Umikaji Terrace"],note:"20 人同行建議包車，減少轉乘等待。"},{day:"Day 5",area:"豐見城 Outlet・那霸機場",mode:"driving",transport:"包車 / 機場接駁 / 巴士",origin:"Almont Hotel Naha Omoromachi",destination:"Naha Airport International Terminal",points:["Okinawa Outlet Mall Ashibinaa","iias Okinawa Toyosaki","Naha Airport International Terminal"],note:"保留退稅、託運與出境緩衝。"}];
    const risks=[["info","賽事日期","2026 正式賽事日尚需等 NAHA Marathon 官方公告；本頁依歷年慣例估為 2026/12/06（日）。"],["high","報名責任","賽事請自行報名。社團僅提供機票、住宿、慶功安排。"],["medium","交通管制","賽事日那霸市區與路線沿線會有交通管制，單軌與步行時間需放大估算。"],["medium","跑後體力","Day 3 與 Day 4 需依團員恢復狀況調整，膝蓋不適者減少階梯與久站。"],["medium","餐廳訂位","燒肉慶功與團體晚餐需盡早確認包廂、預算、飲酒與素食需求。"],["high","航班與價格","機票、住宿、匯率與稅費均為預估，實際依開票、付款、匯率與航空公司規定浮動。"]];
    const clothes=["上身穿搭：排汗短袖或薄長袖；賽事日穿已磨合跑衣。","下身穿搭：熟悉跑褲或壓縮褲；觀光日穿彈性長褲。","外套或防風層：準備薄風衣或輕量外套。","雨具或防水裝備：摺疊傘、輕便雨衣、防水袋。","步行鞋款：觀光日穿緩震佳休閒鞋或恢復鞋。","襪子與足部保護：跑步襪、水泡貼、凡士林、膠帶。","帽子墨鏡防曬：即使 12 月仍需防曬。","晚餐正式場合：燒肉可休閒，高級餐廳避免拖鞋背心。","溫差備品：拋棄式雨衣、薄保暖巾或乾衣。","文化宗教場合：神社與紀念地保持安靜尊重。"];
    function byId(id){return document.getElementById(id)}function isHL(name,list){return list.some(x=>String(name).includes(x))}function suggestNearestDay(item){const s=String(item);if(s.includes("賽")||s.includes("燒肉"))return"Day 2";if(s.includes("首里")||s.includes("國際通")||s.includes("牧志"))return"Day 3";if(s.includes("沖繩世界")||s.includes("玉泉洞")||s.includes("瀨長島"))return"Day 4";if(s.includes("Outlet")||s.includes("機場"))return"Day 5";return"日程:Day 3"}function enc(s){return encodeURIComponent(s)}function buildGoogleMapsRoute(r){return`https://www.google.com/maps/dir/?api=1&origin=${enc(r.origin)}&destination=${enc(r.destination)}&waypoints=${r.points.map(enc).join("|")}&travelmode=${r.mode}`}function sectionTitle(i,t){return`<div class="section-title"><span class="mark">${i}</span><span>${t}</span></div>`}function showSection(id){document.querySelectorAll('main section').forEach(s=>s.classList.remove('active'));byId(id).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));[...document.querySelectorAll('.nav-btn')].find(b=>b.getAttribute('onclick').includes(id))?.classList.add('active');window.scrollTo({top:document.querySelector('.nav').offsetTop,behavior:'smooth'})}function backToTop(){window.scrollTo({top:0,behavior:'smooth'})}
    function renderHeader(){byId('headerRoot').innerHTML=`<span class="kicker">🏃‍♂️ ${trip.group}｜適用於 2026 雙連長跑 海外跑旅 - 那霸站</span><h1>${trip.title}</h1><p>目的地：${trip.destination}｜日期：${trip.dates}｜預估賽事日：<strong>${trip.eventDateEstimate}</strong></p><p>${trip.eventNote}</p><div class="notice-strip"><div><strong>住宿</strong><br>${trip.hotel}<br>${trip.rooms}</div><div><strong>住宿總價</strong><br>JPY ${trip.hotelCostJPY.toLocaleString()}<br>10 間 / 20 人</div><div><strong>預估團費</strong><br>NTD 21,000 / 人<br>不含賽事報名費</div><div><strong>核心安排</strong><br>${trip.highlights.join('・')}</div></div>`}
    function renderItinerary(){let b=trip.budget.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><strong>$ ${r[2]}</strong></td><td>${r[3]}</td></tr>`).join('');let d=itinerary.map(x=>`<article class="card day-card"><div class="day-head"><h3>Day ${x.day}｜${x.date}｜${x.title}</h3><span class="badge sand">${x.area}</span></div><div class="timeline">${x.items.map(i=>`<div class="item"><div class="time">${i[0]}</div><div><h4>${i[1]}</h4><div>${i[2]}</div><div class="meta">${i[3]}</div></div></div>`).join('')}</div></article>`).join('');byId('itinerary').innerHTML=`${sectionTitle('📅','每日行程')}<div class="card"><h3>團體規則與費用估算</h3><p><span class="badge coral">重要</span>賽事請自行報名。社團僅提供機票、住宿、慶功安排。參考行程可斟酌參加，無限制一定要跟隨團體。報名截止後，始開放親友團。Klook、KKday 及其他行程可自行決定是否自費參加。</p><div class="table-wrap"><table><thead><tr><th>項目</th><th>說明</th><th>預估單價</th><th>備註</th></tr></thead><tbody>${b}</tbody></table></div><p class="meta">※ 貨幣單位為新臺幣 NTD。機票、住宿等價格為預估值，將依實際開票與匯率浮動。</p></div>${d}`}
    function renderFood(){let rows=foods.map(f=>`<tr><td>${f[0]}</td><td>${f[1]}</td><td>${f[2]}</td><td>${f[3]}</td><td>${f[4]}</td><td>${f[5]}</td><td>${f[6]}</td><td>${f[7]}</td><td><a href="${f[8]}" target="_blank">參考連結</a></td><td>${f[9]}</td></tr>`).join('');byId('food').innerHTML=`${sectionTitle('🍜','米其林與在地美食')}<div class="card"><p><span class="badge green">查證原則</span>未能逐店確認官方身分者，皆標示為「在地推薦」或「非米其林宣稱」。</p><div class="table-wrap"><table><thead><tr><th>店名</th><th>區域</th><th>類型</th><th>推薦來源</th><th>米其林年度或來源年度</th><th>招牌菜</th><th>預估費用</th><th>安排日</th><th>連結</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table></div></div>`}
    function renderSouvenirs(){byId('souvenirs').innerHTML=`${sectionTitle('🎁','伴手禮建議')}<div class="grid">${souvenirs.map(s=>`<div class="card"><h3>${s[0]}</h3><span class="badge">${s[1]}</span><span class="badge sand">${s[4]}</span><p><strong>推薦品：</strong>${s[2]}</p><p><strong>預估價格：</strong>${s[3]}</p><p><strong>文化意義：</strong>${s[5]}</p><p class="meta">${s[6]}</p></div>`).join('')}</div>`}
    function renderAttractions(){byId('attractions-wall').innerHTML=`${sectionTitle('🏯','景點導覽牆')}<div class="grid">${attractions.map(a=>`<div class="card"><h3>${a[0]}</h3><span class="badge green">建議停留：${a[3]}</span><p><strong>亮點：</strong>${a[1]}</p><p><strong>文化背景：</strong>${a[2]}</p><p><strong>交通方式：</strong>${a[4]}</p><p><strong>注意事項：</strong>${a[5]}</p><p><a href="${a[6]}" target="_blank">參考連結</a></p></div>`).join('')}</div>`}
    function renderDesserts(){byId('desserts').innerHTML=`${sectionTitle('🍰','下午茶甜點特輯')}<div class="grid">${desserts.map(d=>`<div class="card"><h3>${d[0]}</h3><span class="badge">${d[2]}</span><span class="badge sand">${d[4]}</span><p><strong>招牌甜點：</strong>${d[1]}</p><p><strong>區域：</strong>${d[2]}</p><p><strong>特色：</strong>${d[3]}</p><p><a href="${d[5]}" target="_blank">參考連結</a></p></div>`).join('')}</div>`}
    function renderDailyRoutes(){byId('daily-routes').innerHTML=`${sectionTitle('🗺️','每日 Google 路線圖')}<div class="grid">${routes.map(r=>`<div class="card"><h3>${r.day}｜${r.area}</h3><span class="badge green">建議交通：${r.transport}</span><div class="route-line">${r.origin} → ${r.points.join(' → ')} → ${r.destination}</div><p><strong>景點串聯順序：</strong>${r.points.join(' → ')}</p><p><strong>動線重點：</strong>${r.note}</p><p><a href="${buildGoogleMapsRoute(r)}" target="_blank">開啟 Google Maps 路線</a></p></div>`).join('')}</div>`}
    function renderTransportStay(){let rows=trip.flights.map(f=>`<tr><td>${f.day}</td><td>${f.date}</td><td>${f.route}</td><td>${f.flight}</td><td>${f.time}</td><td>${f.note}</td></tr>`).join('');byId('transport-stay').innerHTML=`${sectionTitle('✈️','交通與住宿')}<div class="grid"><div class="card"><h3>航班資訊</h3><div class="table-wrap"><table><thead><tr><th>日程</th><th>日期</th><th>航線</th><th>航班</th><th>時間</th><th>備註</th></tr></thead><tbody>${rows}</tbody></table></div></div><div class="card"><h3>住宿資訊</h3><p><strong>飯店：</strong><span class="hl-red">${trip.hotel}</span></p><p><strong>期間：</strong>2026/12/05 入住，2026/12/09 退房，共 4 晚。</p><p><strong>房型與人數：</strong>${trip.rooms}。</p><p><strong>總價：</strong>JPY ${trip.hotelCostJPY.toLocaleString()}；平均每人約 JPY ${(trip.hotelCostJPY/20).toFixed(0)}。</p></div><div class="card"><h3>城市內交通</h3><p>市區以 Yui Rail 單軌、步行、計程車為主。Day 4 南部行程與 Day 5 Outlet 回機場建議包車或分車計程車。</p></div><div class="card"><h3>自行活動提醒</h3><p>參考行程可斟酌參加，無限制一定要跟隨團體。Klook、KKday 或其他自費行程可自行決定。</p></div></div>`}
    function renderRisks(){byId('risks').innerHTML=`${sectionTitle('⚠️','假設與風險')}<div class="weather-box"><h3>當地天氣評估｜那霸 12 月上旬</h3><p><strong>預估溫度區間：</strong>約 18–24°C，早晚與海邊體感較涼；實際天氣需出發前 7–10 天再次確認。</p><p><strong>降雨可能性：</strong>12 月仍可能有陣雨或東北季風影響，賽事日需準備雨具與防水袋。</p><p><strong>日夜溫差：</strong>跑後汗濕加上海風會快速失溫。</p><p><strong>濕度與風勢：</strong>海島濕度偏高，海邊與橋面風勢可能影響拍照與跑步體感。</p><p><strong>備案：</strong>雨天可改 DFS、San-A Main Place、iias Okinawa Toyosaki、那霸機場提前採買。</p><p><span class="hl-red">出發前需再次確認</span>官方天氣、賽事公告與交通狀態。</p></div><div class="grid">${risks.map(r=>`<div class="risk ${r[0]}"><strong>${r[1]}</strong><br>${r[2]}</div>`).join('')}</div><div class="card"><h3>衣著建議 10 項</h3><div class="clothes">${clothes.map((c,i)=>`<div><span class="badge coral">${i+1}</span>${c}</div>`).join('')}</div></div>`}
    function mount(){renderHeader();renderItinerary();renderFood();renderSouvenirs();renderAttractions();renderDesserts();renderDailyRoutes();renderTransportStay();renderRisks();window.addEventListener('scroll',()=>{byId('backTopBtn').style.display=window.scrollY>500?'grid':'none'})}mount();
