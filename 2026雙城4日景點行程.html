<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 吉隆坡 × 新加坡 4 日地鐵美食景點行程</title>
  <style>
    :root{
      --blue:#0f6fb7;
      --blue-2:#0b4f84;
      --blue-soft:#e8f4ff;
      --local-teal:#0f8f8a;
      --local-gold:#d9a441;
      --local-green:#1f8a5b;
      --local-red:#b8322a;
      --ink:#203040;
      --muted:#5c6b7a;
      --paper:#ffffff;
      --bg:#f4f8fb;
      --line:#d7e7f2;
      --alert-red:#d71920;
      --shadow:0 16px 40px rgba(20,70,110,.13);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      color:var(--ink);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
      background:
        radial-gradient(circle at 12% 8%, rgba(217,164,65,.18), transparent 25%),
        radial-gradient(circle at 92% 18%, rgba(15,143,138,.14), transparent 26%),
        linear-gradient(135deg, rgba(15,111,183,.06) 25%, transparent 25%) 0 0/28px 28px,
        linear-gradient(225deg, rgba(31,138,91,.06) 25%, transparent 25%) 0 0/28px 28px,
        var(--bg);
      line-height:1.72;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.14;
      background-image:
        repeating-linear-gradient(45deg, transparent 0 18px, rgba(11,79,132,.08) 18px 19px),
        radial-gradient(circle at 30px 30px, rgba(217,164,65,.28) 0 2px, transparent 3px);
      z-index:-1;
    }
    a{color:var(--blue-2);font-weight:800;text-decoration:none}
    a:hover{text-decoration:underline}
    .hl-red{color:var(--alert-red);font-weight:900;}
    .time{white-space:nowrap;}
    .container{width:min(1180px,92vw);margin:0 auto}
    header{
      position:relative;
      overflow:hidden;
      color:white;
      padding:48px 0 34px;
      background:
        linear-gradient(120deg, rgba(7,45,78,.96), rgba(15,111,183,.92), rgba(15,143,138,.9)),
        radial-gradient(circle at 80% 20%, rgba(217,164,65,.55), transparent 22%);
      box-shadow:0 14px 40px rgba(0,0,0,.18);
    }
    header:after{
      content:"吉隆坡雙子星 × 新加坡魚尾獅 × 地鐵美食散策";
      position:absolute;
      right:-80px;
      bottom:8px;
      font-size:56px;
      font-weight:900;
      color:rgba(255,255,255,.08);
      white-space:nowrap;
      letter-spacing:3px;
    }
    .hero{position:relative;z-index:1}
    .eyebrow{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);padding:8px 14px;border-radius:999px;font-weight:800}
    h1{font-size:clamp(28px,4vw,52px);line-height:1.15;margin:18px 0 12px}
    .hero-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:18px;align-items:stretch}
    .hero-card{
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.22);
      border-radius:var(--radius);
      padding:18px;
      backdrop-filter:blur(10px);
    }
    .hero-card strong{color:#fff1b8}
    nav{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(255,255,255,.94);
      backdrop-filter:blur(14px);
      border-bottom:1px solid var(--line);
      box-shadow:0 8px 24px rgba(30,70,100,.08);
    }
    .nav-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px 0}
    .nav-btn{
      border:0;
      border-radius:16px;
      padding:12px 10px;
      color:#fff;
      cursor:pointer;
      font-weight:900;
      background:linear-gradient(135deg,var(--blue),var(--local-teal));
      box-shadow:0 8px 18px rgba(15,111,183,.18);
      transition:.18s ease;
    }
    .nav-btn:hover,.nav-btn.active{transform:translateY(-2px);background:linear-gradient(135deg,var(--blue-2),var(--local-green))}
    main{padding:28px 0 70px}
    section{display:none}
    section.active{display:block;animation:rise .35s ease}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .section-title{
      display:flex;
      align-items:center;
      gap:12px;
      margin:18px 0 18px;
      color:var(--blue-2);
      font-size:clamp(23px,2.6vw,34px);
      font-weight:950;
    }
    .section-title .mark{
      width:44px;height:44px;border-radius:15px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--local-gold),#ffe9a6);
      color:#5c3900;
      box-shadow:var(--shadow);
    }
    .grid{display:grid;gap:18px}
    .grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
    .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
    .card{
      background:rgba(255,255,255,.94);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:20px;
      position:relative;
      overflow:hidden;
    }
    .card:before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:6px;
      background:linear-gradient(90deg,var(--blue),var(--local-teal),var(--local-gold));
    }
    .card h3,.card h4{margin:8px 0 8px;color:var(--blue-2);line-height:1.35}
    .muted{color:var(--muted)}
    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 10px;
      border-radius:999px;
      background:var(--blue-soft);
      color:var(--blue-2);
      font-size:13px;
      font-weight:900;
      border:1px solid #c9e4f6;
      margin:3px 4px 3px 0;
    }
    .badge.gold{background:#fff3cd;color:#7a5200;border-color:#f1d98c}
    .badge.green{background:#e6f6ee;color:#0d6841;border-color:#bce6cf}
    .badge.red{background:#ffe9e9;color:#a41418;border-color:#ffc6c6}
    .day{
      margin:0 0 24px;
      border-radius:28px;
      overflow:hidden;
      border:1px solid var(--line);
      background:rgba(255,255,255,.85);
      box-shadow:var(--shadow);
    }
    .day-head{
      color:white;
      padding:18px 22px;
      background:linear-gradient(135deg,var(--blue-2),var(--local-teal));
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
    }
    .day-head h3{margin:0;color:#fff}
    .timeline{padding:18px 20px 20px}
    .event{
      display:grid;
      grid-template-columns:110px 1fr;
      gap:14px;
      border-left:5px solid var(--line);
      padding:0 0 18px 18px;
      margin-left:8px;
      position:relative;
    }
    .event:before{
      content:"";
      width:15px;height:15px;border-radius:50%;
      background:var(--local-gold);
      position:absolute;left:-10px;top:6px;
      border:3px solid white;
      box-shadow:0 0 0 2px var(--local-gold);
    }
    .event:last-child{padding-bottom:0}
    .event .time{
      color:var(--blue-2);
      font-weight:950;
      background:var(--blue-soft);
      border:1px solid #cce5f6;
      border-radius:14px;
      padding:8px;
      height:max-content;
      text-align:center;
    }
    .event-body{
      background:#fff;
      border:1px solid #e7eef5;
      border-radius:18px;
      padding:14px;
    }
    .event-body h4{margin:0 0 6px}
    .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
    .meta div{background:#f7fbff;border:1px solid #e1edf6;border-radius:14px;padding:8px;font-size:13px}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    th{color:var(--blue-2);text-align:left;font-size:13px;padding:0 10px}
    td{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 10px;vertical-align:top}
    td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;font-weight:900;color:var(--blue-2)}
    td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
    .route-card{
      background:linear-gradient(135deg,#ffffff,#f2fbff);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:20px;
      box-shadow:var(--shadow);
    }
    .route-line{
      padding:12px;
      background:#fff;
      border:1px dashed var(--blue);
      border-radius:16px;
      font-weight:850;
      color:var(--blue-2);
    }
    .risk{border-left:7px solid var(--blue);padding:14px 16px;border-radius:16px;background:#fff;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .risk.medium{border-left-color:var(--local-gold)}
    .risk.high{border-left-color:var(--alert-red)}
    .weather-box{
      background:linear-gradient(135deg,#e8f4ff,#fff8df);
      border:1px solid #cce3f6;
      border-radius:var(--radius);
      padding:20px;
    }
    .clothes{counter-reset:item;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .cloth{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:13px;
    }
    .cloth:before{
      counter-increment:item;
      content:counter(item);
      display:inline-grid;
      place-items:center;
      width:24px;height:24px;
      border-radius:50%;
      background:var(--blue);
      color:white;
      font-weight:900;
      margin-right:8px;
    }
    #backTop{
      position:fixed;right:18px;bottom:18px;
      width:52px;height:52px;border-radius:50%;
      border:0;
      background:linear-gradient(135deg,var(--local-gold),var(--local-red));
      color:white;
      font-size:22px;
      font-weight:950;
      box-shadow:0 12px 26px rgba(0,0,0,.22);
      cursor:pointer;
      display:none;
      z-index:30;
    }
    .note{font-size:13px;color:var(--muted)}
    .mini-list{margin:8px 0 0;padding-left:20px}
    .mini-list li{margin:4px 0}
    @media(max-width:880px){
      .hero-grid,.grid.two,.grid.three,.clothes{grid-template-columns:1fr}
      .nav-inner{grid-template-columns:repeat(2,1fr)}
      .event{grid-template-columns:1fr}
      .event .time{text-align:left;width:max-content}
      .meta{grid-template-columns:1fr 1fr}
      table,thead,tbody,tr,th,td{display:block}
      thead{display:none}
      tr{margin-bottom:14px}
      td{border:1px solid var(--line)!important;border-radius:14px!important;margin-bottom:4px}
      td:before{content:attr(data-label);display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:3px}
    }
    @media(max-width:520px){
      .nav-inner{grid-template-columns:1fr}
      .meta{grid-template-columns:1fr}
      header{padding-top:34px}
      .card{padding:16px}
    }
  </style>
</head>

      ["Petronas Twin Towers 雙子星塔","吉隆坡 KLCC","雙塔天際線、KLCC Park、夜間燈光","雙子星是吉隆坡最具辨識度的現代地標，以伊斯蘭幾何紋樣與鋼鐵玻璃立面形塑馬來西亞首都的國際形象。旅人可在 KLCC Park 尋找水池與樹影前景，拍出雙塔垂直線條。若不登塔，也能透過公園、Suria KLCC 與周邊空橋感受金融區節奏，是第一次到吉隆坡必訪的城市名片。","1.5-2 小時","MRT / LRT 至 KLCC，步行銜接","登塔需預約；午後雷雨時改百貨室內。","https://www.google.com/maps/search/?api=1&query=Petronas+Twin+Towers"],

      ["Pavilion Kuala Lumpur","吉隆坡 Bukit Bintang","購物、餐飲、冷氣雨備","Pavilion 是武吉免登最具代表性的購物中心之一，連接精品、餐飲、超市與街區步行動線。對入住 PARKROYAL COLLECTION Kuala Lumpur 的旅人來說，這裡是調整時差、避雨、換匯、採買與晚餐備案的核心據點。商場周邊也能感受吉隆坡多族群都會消費文化，從國際品牌到南洋餐飲都集中在短距離內。","1-2 小時","飯店步行或 Bukit Bintang MRT","週末人多，保管財物。","https://www.google.com/maps/search/?api=1&query=Pavilion+Kuala+Lumpur"],
      ["Jalan Alor 亞羅街","吉隆坡 Bukit Bintang","夜市美食、霓虹招牌、熱炒","Jalan Alor 是吉隆坡夜間街頭飲食的代表場景，沿街攤棚、熱炒香氣、榴槤攤與多語言招牌交織成南洋城市的夜生活。它不一定是最精緻的餐飲選擇，卻很適合第一晚感受吉隆坡的開放、熱鬧與多族群飲食文化。使用者指定的亞興飯店可放在此區域搜尋確認，若店況變動，整條街仍有大量替代餐點。","1-1.5 小時","Bukit Bintang MRT 後步行","價格與店家評價落差大，點餐前確認。","https://www.google.com/maps/search/?api=1&query=Jalan+Alor+Kuala+Lumpur"],
      ["Central Market 中央市場","吉隆坡 Pasar Seni","蠟染、手工藝、伴手禮","中央市場由傳統濕貨市場轉型為文化與手工藝空間，是理解吉隆坡多元文化伴手禮的好入口。館內可見蠟染布、錫器、木雕、明信片與各民族風格小物，適合購買體積小、文化辨識度高的紀念品。建築本身也保留老城區尺度，與周邊茨廠街、河岸、獨立廣場可組成地鐵步行散策。","1-1.5 小時","MRT Pasar Seni 後步行","觀光價格需比較；貴重工藝確認材質。","https://www.google.com/maps/search/?api=1&query=Central+Market+Kuala+Lumpur"],
      ["Petaling Street 茨廠街","吉隆坡 Chinatown","騎樓、華人街、街頭小吃","茨廠街是吉隆坡華人商業記憶的重要街區，從藥材、茶餐室、老招牌到新式咖啡館，展現城市更新與老街生活並存的樣貌。街區周邊可看見華人廟宇、印度廟與殖民時期建築在短距離內交錯，正是吉隆坡多族群共居的縮影。適合午後搭配中央市場與獨立廣場步行，邊走邊觀察騎樓與街頭飲食。","1 小時","MRT Pasar Seni 後步行","人潮多，注意扒手與仿冒品。","https://www.google.com/maps/search/?api=1&query=Petaling+Street+Kuala+Lumpur"],
      ["Merdeka Square 獨立廣場","吉隆坡 老城區","歷史草坪、旗桿、殖民建築","獨立廣場象徵馬來西亞國家歷史的重要時刻，周邊聚集蘇丹阿都沙末大廈、皇家雪蘭莪俱樂部與舊政府建築。廣場的開闊草坪與摩爾式拱廊呈現殖民行政中心的空間語彙，也讓旅人理解吉隆坡從錫礦聚落走向首都的歷史轉折。傍晚光線柔和，適合拍攝建築立面。","45-90 分鐘","Masjid Jamek LRT / MRT Pasar Seni 步行","戶外少遮蔭，避開正午。","https://www.google.com/maps/search/?api=1&query=Merdeka+Square+Kuala+Lumpur"],
      ["Sultan Abdul Samad Building","吉隆坡 老城區","摩爾式建築、鐘樓、拱廊","蘇丹阿都沙末大廈是吉隆坡最具代表性的歷史建築之一，紅磚、白色拱線與銅色圓頂展現英殖民時期對伊斯蘭與摩爾風格的詮釋。它面向獨立廣場，見證行政、法律與國家儀典的城市記憶。對喜歡建築與攝影的旅人來說，這裡能用短時間捕捉吉隆坡不同於現代高樓的歷史層次。","30-60 分鐘","Masjid Jamek LRT 後步行","多為外觀拍攝，進入限制依現場。","https://www.google.com/maps/search/?api=1&query=Sultan+Abdul+Samad+Building"],
      ["Masjid Jamek","吉隆坡 老城區","河流交會、清真寺外觀","Masjid Jamek 坐落於巴生河與鵝嘜河交會處，是吉隆坡早期城市發展的重要地點。白色洋蔥形圓頂、拱廊與棕櫚樹共同形成柔和的河岸景觀，與周邊高樓對比鮮明。旅人可在外圍步道理解清真寺在馬來社會中的日常位置，也能將它與獨立廣場、中央市場安排成一條文化步行線。","30-60 分鐘","LRT Masjid Jamek","進入宗教場所需遵守衣著與禮拜時間規定。","https://www.google.com/maps/search/?api=1&query=Masjid+Jamek+Kuala+Lumpur"],
      ["Kampung Baru","吉隆坡","椰漿飯、傳統馬來聚落、雙塔視角","Kampung Baru 是吉隆坡市中心少見仍保有傳統馬來聚落氣質的街區，低矮住宅、路邊餐攤與遠方雙子星形成強烈對比。這裡適合品嚐椰漿飯、烤魚與馬來家常菜，同時觀察城市開發與在地生活如何並存。若安排晚上前往，能拍到摩天樓與傳統屋舍同框的吉隆坡獨特畫面。","1-1.5 小時","LRT Kampung Baru","夜間部分巷弄較暗，建議結伴或使用 Grab。","https://www.google.com/maps/search/?api=1&query=Kampung+Baru+Kuala+Lumpur"],
      ["Kampong Gelam 甘榜格南","新加坡 Bugis","蘇丹清真寺、哈芝巷、馬來阿拉伯文化","甘榜格南是新加坡最適合步行感受多族群文化的區域之一，從蘇丹清真寺金色圓頂、Arab Street 布料店，到 Haji Lane 的壁畫與選物店，短短幾條街呈現馬來、阿拉伯、印度穆斯林與年輕創意社群的交會。飯店位於 Beach Road，抵達日不必長途移動即可深入街區，非常適合作為新加坡第一站。","1.5-2 小時","飯店步行 / MRT Bugis","宗教場所附近注意衣著與拍照禮貌。","https://www.google.com/maps/search/?api=1&query=Kampong+Gelam+Singapore"],
      ["Sultan Mosque 蘇丹清真寺","新加坡 Kampong Gelam","金色圓頂、宗教地標","蘇丹清真寺是新加坡穆斯林社群的重要地標，金色圓頂與對稱立面讓它成為甘榜格南最醒目的視覺中心。周邊街道保留布料、香水、地毯與穆斯林飲食文化，展現新加坡作為港口城市的移民歷史。即使只在外觀停留，也能理解宗教建築如何形塑街區氣質與日常生活。","30-60 分鐘","MRT Bugis / 飯店步行","入內需遵守開放時間與服裝規定。","https://www.google.com/maps/search/?api=1&query=Sultan+Mosque+Singapore"],
      ["Haji Lane 哈芝巷","新加坡 Kampong Gelam","壁畫、小店、咖啡","Haji Lane 是新加坡年輕創意與觀光街區的代表，狹窄巷弄中聚集彩色壁畫、獨立服飾、香氛小店與咖啡館。它與蘇丹清真寺、Arab Street 只隔幾步，卻呈現截然不同的潮流表情。抵達新加坡後在此散步，可用較低體力完成拍照、下午茶與輕購物，是短停留行程的高效率選擇。","45-90 分鐘","飯店步行","午後人潮多，拍照需留意車輛與店家門口。","https://www.google.com/maps/search/?api=1&query=Haji+Lane+Singapore"],
      ["Merlion Park 魚尾獅公園","新加坡 Marina Bay","魚尾獅、金沙天際線、夜景","魚尾獅公園是新加坡最經典的城市地標取景點，面向 Marina Bay，可一次看到魚尾獅、濱海灣金沙、金融區與海灣水面。這個符號融合獅城傳說與海港城市身份，是新加坡觀光形象的核心。建議傍晚至夜間前往，光線、天際線與水面倒影最有層次，也能順路銜接 Lau Pa Sat 晚餐。","45-75 分鐘","MRT Raffles Place / Bayfront + 步行","熱門拍照點擁擠，雷雨時改室內。","https://www.google.com/maps/search/?api=1&query=Merlion+Park+Singapore"],
      ["Marina Bay Sands","新加坡 Marina Bay","金沙建築、購物、濱海灣夜景","濱海灣金沙以三座塔樓托起空中船型平台，是新加坡全球化城市景觀的象徵。即使不登上觀景台，也可在商場、水岸步道與藝術科學博物館周邊感受城市規劃的精準與華麗。對短暫停留者來說，這裡與魚尾獅公園、Gardens by the Bay 可組成夜間散策核心，雨天也能轉入室內商場。","1-2 小時","MRT Bayfront","觀景台與展覽票價需出發前確認。","https://www.google.com/maps/search/?api=1&query=Marina+Bay+Sands"],
      ["Gardens by the Bay","新加坡 Marina Bay","超級樹、花穹、雲霧林","濱海灣花園展現新加坡花園城市的高度人工與自然整合。超級樹在夜間燈光秀時最具戲劇性，花穹與雲霧林則適合作為高溫或下雨時的室內備案。這裡不只是觀光景點，也體現新加坡以景觀工程、永續技術與城市品牌共同打造公共空間的能力。若時間有限，可只走戶外超級樹區。","1.5-3 小時","MRT Bayfront + 步行","展館門票、燈光秀時間需再次確認。","https://www.google.com/maps/search/?api=1&query=Gardens+by+the+Bay"],
      ["Chinatown 牛車水","新加坡","佛牙寺、伴手禮、熟食中心","牛車水是新加坡華人移民歷史的重要街區，廟宇、會館、騎樓、熟食中心與現代酒吧在此並存。短時間旅客可從 Chinatown MRT 出站，走訪佛牙寺外觀、史密斯街與伴手禮店，再視時間品嚐 Maxwell Food Centre。這裡與新加坡國家敘事中的多元族群密切相關，也適合返程前採買輕便紀念品。","1-2 小時","MRT Chinatown","返程日需抓緊回飯店取行李時間。","https://www.google.com/maps/search/?api=1&query=Chinatown+Singapore"],

      ["medium","排隊與訂位","米其林、熟食中心與瓦煲雞飯可能排隊；高端餐廳需提前訂位。未確認營業時間者均標示出發前需再次確認。"],
      ["high","午後雷雨與濕熱","5 月馬來西亞與新加坡通常濕熱，午後雷陣雨機率高，戶外拍照與步行需保留雨備。"],
      ["medium","會員早餐權益","GHA 鈦金卡早餐、升等、延遲退房與 Lounge 權益可能依飯店政策、訂房管道與入住率不同而變動。"],
      ["info","治安與財物","Bukit Bintang、Jalan Alor、Bugis、牛車水等人潮多，注意手機、護照、錢包與包包拉鍊。"],

    function byId(id){return document.getElementById(id);}
    function isHL(name,list){return list.some(x => String(name).toLowerCase().includes(String(x).toLowerCase()) || String(x).toLowerCase().includes(String(name).toLowerCase()));}
    function suggestNearestDay(item){
      const text = JSON.stringify(item);
      if(text.includes("吉隆坡") || text.includes("Kuala Lumpur") || text.includes("MYR")) return "日程:Day 2";
      if(text.includes("新加坡") || text.includes("Singapore") || text.includes("SGD")) return "日程:Day 3";
      return "日程:Day 2";
    }
    function buildGoogleMapsRoute(dayRoute){
      const enc = encodeURIComponent;
      const origin = enc(dayRoute.origin);
      const destination = enc(dayRoute.destination);
      const waypoints = dayRoute.points.map(enc).join("|");
      let travelmode = "transit";
      if(dayRoute.mode.includes("步行") && !dayRoute.mode.includes("飛機")) travelmode = "transit";
      return `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${destination}&waypoints=${waypoints}&travelmode=${travelmode}`;
    }
    function showSection(id){
      document.querySelectorAll("main section").forEach(s=>s.classList.remove("active"));
      byId(id).classList.add("active");
      document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
      [...document.querySelectorAll(".nav-btn")].find(b=>b.getAttribute("onclick").includes(id))?.classList.add("active");
      window.scrollTo({top:0,behavior:"smooth"});
    }
    function backToTop(){window.scrollTo({top:0,behavior:"smooth"});}

    function renderHeader(){

        </div>
        <div class="hero-card">

    function renderFood(){

    function renderRisks(){

          <p><strong>降雨與濕度：</strong>午後雷雨、短時強降雨與高濕度可能影響戶外拍照、地鐵步行、Jalan Alor、魚尾獅公園與濱海灣夜景。建議準備折傘、輕量雨衣、防水袋與快乾衣物。</p>
          <p><strong>交通影響：</strong>暴雨時 Grab / 計程車需求上升、車資與等待時間增加；地鐵仍是主要穩定方案。戶外景點遇雨即改百貨、博物館、Jewel Changi 或熟食中心。</p>
          <p><strong>雨備或高溫備案：</strong>吉隆坡改 Pavilion、Suria KLCC、Central Market 室內；新加坡改 Bugis Junction、Marina Bay Sands、National Gallery、Jewel Changi。所有天氣資訊出發前需再次確認。</p>
        </div>
        <div class="grid two" style="margin-top:18px">
          ${risks.map(r=>`
            <div class="risk ${r[0]}">
              <span class="badge ${r[0]==='high'?'red':r[0]==='medium'?'gold':'green'}">${r[0]}</span>
              <h3>${r[1]}</h3>
              <p>${r[2]}</p>
            </div>`).join("")}
        </div>
        <div class="section-title"><span class="mark">👕</span>衣著建議 10 項</div>
        <div class="clothes">
          <div class="cloth"><strong>上身穿搭：</strong>排汗短袖、薄襯衫或透氣棉麻上衣，適合濕熱與地鐵移動。</div>
          <div class="cloth"><strong>下身穿搭：</strong>輕薄長褲、寬褲或及膝裙褲，兼顧步行與宗教場所禮儀。</div>
          <div class="cloth"><strong>外套或防風層：</strong>帶一件薄外套或輕量襯衫，應對飯店、百貨與機場強冷氣。</div>

          <div class="cloth"><strong>襪子與足部保護：</strong>透氣吸濕襪、備用襪與小水泡貼，適合連續地鐵步行。</div>
          <div class="cloth"><strong>帽子、墨鏡或防曬：</strong>戶外 KLCC、獨立廣場、魚尾獅公園需防曬帽、墨鏡與防曬乳。</div>
          <div class="cloth"><strong>晚餐或正式場合服裝：</strong>若臨時訂高端米其林餐廳，準備 smart casual，避免拖鞋、背心與運動短褲。</div>

        </div>`;
    }

    function mount(){
      renderHeader();
      renderItinerary();
      renderFood();
      renderSouvenirs();
      renderAttractions();
      renderDesserts();
      renderDailyRoutes();
      renderTransportStay();
      renderRisks();
      window.addEventListener("scroll",()=>{byId("backTop").style.display = window.scrollY > 420 ? "block" : "none";});
    }
    mount();
  </script>
