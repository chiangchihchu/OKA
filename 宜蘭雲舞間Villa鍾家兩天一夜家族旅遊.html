<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root{
      --primary-blue:#1e6f9f;
      --primary-blue-dark:#134a6b;
      --yilan-green:#6fa36f;
      --yilan-rice:#f6edcf;
      --yilan-water:#d9f0f4;
      --yilan-earth:#b77945;
      --card:#fffdf7;
      --ink:#263238;
      --muted:#65727a;
      --line:#d9e4df;
      --alert-red:#d62828;
      --medium:#d88900;
      --high:#b00020;
      --shadow:0 14px 32px rgba(30,73,88,.14);
      --radius:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 8%,rgba(255,255,255,.9) 0 10%,transparent 11%),
        radial-gradient(circle at 92% 18%,rgba(111,163,111,.24) 0 10%,transparent 11%),
        linear-gradient(135deg,var(--yilan-water),var(--yilan-rice) 54%,#e7f4df);
      min-height:100vh;
    }
    body:before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      opacity:.18;
      background:
        linear-gradient(120deg,transparent 0 38%,rgba(30,111,159,.35) 39% 40%,transparent 41%),
        repeating-linear-gradient(90deg,rgba(111,163,111,.35) 0 2px,transparent 2px 28px);
      mask-image:linear-gradient(to bottom,black,transparent 80%);
    }
    .container{max-width:1180px;margin:auto;padding:18px}
    header{
      position:relative;
      overflow:hidden;
      border-radius:30px;
      padding:34px 26px;
      background:
        linear-gradient(135deg,rgba(19,74,107,.95),rgba(30,111,159,.84)),
        radial-gradient(circle at top right,#fff 0 10%,transparent 11%);
      color:white;
      box-shadow:var(--shadow);
    }
    header:after{
      content:"龜山島・稻田・三星蔥・家族歡聚";
      position:absolute;
      right:20px;
      bottom:16px;
      color:rgba(255,255,255,.18);
      font-weight:900;
      font-size:34px;
      letter-spacing:.08em;
    }
    h1{margin:0 0 12px;font-size:clamp(26px,5vw,48px);line-height:1.1}
    .subtitle{font-size:clamp(16px,2.4vw,22px);font-weight:700;color:#eef9ff}
    .chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .chip,.badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      background:rgba(255,255,255,.18);
      border:1px solid rgba(255,255,255,.34);
      font-size:14px;
      font-weight:800;
    }
    nav{
      position:sticky;
      top:0;
      z-index:10;
      margin:16px 0;
      padding:12px;
      border-radius:22px;
      background:rgba(255,253,247,.92);
      box-shadow:var(--shadow);
      backdrop-filter:blur(12px);
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }
    nav button,.top-btn{
      border:0;
      border-radius:16px;
      padding:12px 10px;
      background:#eaf5f8;
      color:var(--primary-blue-dark);
      font-weight:900;
      cursor:pointer;
      transition:.2s;
    }
    nav button.active,nav button:hover,.top-btn:hover{
      background:var(--primary-blue);
      color:white;
      transform:translateY(-1px);
    }
    section{display:none;animation:fade .28s ease}
    section.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .section-title{
      margin:28px 0 14px;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:28px;
      color:var(--primary-blue-dark);
    }
    .section-title:before{
      content:"";
      width:12px;
      height:34px;
      border-radius:99px;
      background:linear-gradient(var(--primary-blue),var(--yilan-green));
      flex:0 0 auto;
    }
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card{
      background:rgba(255,253,247,.94);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:18px;
      box-shadow:var(--shadow);
    }
    .day-card{border-left:8px solid var(--yilan-green)}
    .day-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      margin-bottom:12px;
    }
    .day-head h3{margin:0;color:var(--primary-blue-dark);font-size:24px}
    .timeline{display:grid;gap:12px}
    .event{
      display:grid;
      grid-template-columns:86px 1fr;
      gap:12px;
      padding:12px;
      border-radius:18px;
      background:#f7fbf7;
      border:1px dashed #c9dcd0;
    }
    .time{
      white-space:nowrap;
      font-weight:900;
      color:var(--primary-blue);
      background:white;
      border-radius:14px;
      padding:9px;
      text-align:center;
      align-self:start;
    }
    .event h4{margin:0 0 6px;font-size:18px}
    .meta{color:var(--muted);font-size:14px;line-height:1.6}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    th{text-align:left;color:var(--primary-blue-dark);font-size:13px;padding:6px}
    td{
      background:var(--card);
      border-top:1px solid var(--line);
      border-bottom:1px solid var(--line);
      padding:10px 8px;
      vertical-align:top;
      font-size:14px;
      line-height:1.5;
    }
    td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px;font-weight:900}
    td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
    a{color:var(--primary-blue-dark);font-weight:900;text-decoration:none;border-bottom:1px solid rgba(30,111,159,.25)}
    .hl-red{color:var(--alert-red);font-weight:900}
    .route-card{
      background:linear-gradient(135deg,#fffdf7,#eef9fb);
      border:1px solid var(--line);
      border-radius:24px;
      padding:18px;
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }
    .route-card:before{
      content:"";
      position:absolute;
      right:-30px;
      top:-30px;
      width:120px;
      height:120px;
      border-radius:50%;
      background:rgba(111,163,111,.18);
    }
    .route-flow{font-weight:900;line-height:1.8;color:var(--primary-blue-dark)}
    .risk{border-left:8px solid var(--primary-blue)}
    .risk.medium{border-left-color:var(--medium)}
    .risk.high{border-left-color:var(--high)}
    .weather-box{
      background:linear-gradient(135deg,#e8f7ff,#fff8df);
      border:2px solid #cbe5ef;
      border-radius:24px;
      padding:18px;
      margin-bottom:16px;
    }
    .clothes{counter-reset:item;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .clothes div{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
    }
    .clothes div:before{
      counter-increment:item;
      content:counter(item) ". ";
      font-weight:900;
      color:var(--primary-blue);
    }
    .top-btn{
      position:fixed;
      right:18px;
      bottom:18px;
      box-shadow:var(--shadow);
      z-index:11;
    }
    .note{font-size:13px;color:var(--muted);line-height:1.7}
    .pill{
      display:inline-block;
      margin:3px 4px 3px 0;
      padding:5px 9px;
      border-radius:999px;
      background:#edf7ed;
      color:#315b36;
      font-size:12px;
      font-weight:900;
    }
    .room-grid{
      display:grid;
      grid-template-columns:repeat(5,minmax(0,1fr));
      gap:12px;
      margin-top:14px;
    }
    .room-card{
      border-radius:18px;
      padding:14px;
      background:linear-gradient(135deg,#ffffff,#edf8f1);
      border:1px solid var(--line);
      min-height:96px;
    }
    .room-no{
      font-size:22px;
      font-weight:950;
      color:var(--primary-blue-dark);
      margin-bottom:8px;
    }
    .room-family{
      font-size:16px;
      font-weight:900;
      color:var(--ink);
    }
    .feature-list{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:10px;
      margin-top:12px;
    }
    .feature{
      background:#fff;
      border:1px solid var(--line);
      border-radius:16px;
      padding:12px;
      line-height:1.6;
    }
    @media(max-width:860px){
      nav{grid-template-columns:repeat(2,1fr)}
      .grid,.grid-3,.clothes,.feature-list{grid-template-columns:1fr}
      .room-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .event{grid-template-columns:72px 1fr}
      table,thead,tbody,tr,th,td{display:block}
      thead{display:none}
      tr{margin-bottom:12px}
      td{border:1px solid var(--line)!important;border-radius:12px!important;margin-bottom:2px}
      td:before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:4px}
      header:after{font-size:20px}
    }
  </style>
</head>

          <p class="meta"><b>入住：</b>2026/8/8 15:00，出發前需再次確認。<br><b>退房：</b>2026/8/9，時間待補充，出發前需再次確認。<br><b>待確認事項：</b>房型分配、停車數、廚房設備、烤肉規範、泳池使用、垃圾分類、押金、門禁、寵物與噪音規定。</p>

    function renderRisks(){
      byId("risks").innerHTML=`<h2 class="section-title">假設與風險</h2>
      <div class="weather-box">
        <h3>當地天氣評估｜宜蘭 8 月</h3>
        <p>行程期間為 2026/8/8－8/9，屬宜蘭盛夏。依宜蘭 8 月氣候常態，白天高溫約 31－33°C、低溫約 25－27°C，悶熱潮濕，午後雷陣雨與颱風外圍環流皆需留意。日夜溫差通常不大，但室內冷氣與戶外高溫落差明顯；海邊與農田日曬強，短暫強降雨會影響拍照、停車、戶外排隊與行車視線。</p>

      renderFood();
      renderSouvenirs();
